name: Deploy Scraper

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Scraper
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}

          script: |
            cd ~/pbl-project/scraper
            git pull origin main
